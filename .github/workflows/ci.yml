name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck --version && shellcheck -x local-stack.sh wb.sh lib/conf.sh tests/*.sh

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Each way of seeing listeners: ss (default), lsof, and the bash /dev/tcp probe.
        port_tool: [ss, lsof, probe]
    env:
      LOCAL_STACK_PORT_TOOL: ${{ matrix.port_tool }}
    steps:
      - uses: actions/checkout@v4
      - if: matrix.port_tool == 'lsof'
        run: sudo apt-get update -q && sudo apt-get install -y -q lsof
      - run: git config --global init.defaultBranch main
      - run: tests/run.sh
      - name: Demo with the shipped Acme HR config
        run: |
          export LOCAL_STACK_REGISTRY="$RUNNER_TEMP/registry.tsv"
          ./local-stack.sh ports
          eval "$(./local-stack.sh reserve ci-demo)"
          test "$LOCAL_STACK_SLOT" != 0
          ./local-stack.sh env ci-demo web
          ./local-stack.sh status
          ./local-stack.sh check "$API_PORT" || true
          ./local-stack.sh release ci-demo
