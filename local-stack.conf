# local-stack.conf: Acme HR example.
#
# Acme HR runs three services locally: an API, a web app and a payroll engine.
# Each copy of the stack gets one "slot": slot n uses  base port + stride * n
# for every service. Slot 0 is the developer's own stack on the default ports and
# is never handed out.
#
# The file is a small TOML subset: [sections], key = "string" | number | ["list"].
# Lists must open and close on one line.

[stack]
name = "acme-hr"            # registry key; several stacks can share one registry
slots = 8                   # slots 1..8 are handed out
stride = 10                 # slot n = base + 10 * n (override per service below)
grace_seconds = 1800        # a fresh reservation is never "stale" before this
registry = "~/.local/state/local-stack/registry.tsv"   # machine-wide, shared
# Exported for every role. Placeholders: {name} {slot} {stack} {db} {template} {port.<service>}
exports = ["DB_NAME={db}", "APP_URL=http://localhost:{port.web}"]

[database]
template = "acme_hr_template"           # a migrated, seeded database to copy
name = "acme_hr_{name}"                 # one database per task; never a shared one
clone = "createdb -T {template} {db}"   # used by wb.sh add / wb.sh db
drop = "dropdb --if-exists {db}"        # used by wb.sh rm --drop-db

[service.api]
port = 8000
port_var = "API_PORT"
exports = ["DATABASE_URL=postgresql://localhost:5432/{db}", "CORS_ORIGIN=http://localhost:{port.web}"]

[service.web]
port = 3000
port_var = "WEB_PORT"
exports = ["API_URL=http://localhost:{port.api}", "PAYROLL_URL=http://localhost:{port.payroll}"]

[service.payroll]
port = 9000
port_var = "PAYROLL_PORT"
exports = ["DATABASE_URL=postgresql://localhost:5432/{db}", "API_URL=http://localhost:{port.api}"]

[workbench]
root = "~/.local/share/local-stack/acme-hr"   # stores/ and trees/ live here
default_ref = "origin/main"                   # what a new task branches from
branch_prefix = "wb/"                         # task branches: wb/<task>
# Your everyday checkouts. wb.sh only ever reads from them.
protected = ["~/code/acme-api", "~/code/acme-web", "~/code/acme-payroll"]
